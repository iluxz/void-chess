<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>void chess</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<canvas id="particles"></canvas>
<div id="header">
  <h1>void chess</h1>
  <div id="status">your move (white)</div>
</div>
<div id="game">
  <div id="boardWrap">
    <canvas id="board3d"></canvas>
  </div>
  <div id="sidebar">
    <div id="objPanel">
      <h3>obj</h3>
      <div id="objText">...huh. you want to play chess? fine. but i make the rules.</div>
      <div id="ruleLog"></div>
    </div>
    <div id="capturedPanel">
      <h3>captured</h3>
      <div id="capturedWhite"></div>
      <div id="capturedBlack"></div>
    </div>
    <div id="controls">
      <button id="undoBtn">undo</button>
      <button id="hintBtn">hint</button>
      <button id="accuseBtn">accuse</button>
      <button id="cheatBtn" title="make an illegal move">cheat</button>
      <button id="resignBtn">resign</button>
      <button id="newGameBtn">new game</button>
    </div>
  </div>
</div>
<button id="bookBtn">📖 rulebook</button>
<div id="legend">right-click drag to rotate | scroll to zoom | click pieces to move | obj can cheat. so can you. but dont get caught.</div>
<div id="accuseOverlay">
  <h2 id="accuseTitle">ACCUSED</h2>
  <p id="accuseMsg"></p>
  <button onclick="closeAccuse()">ok</button>
</div>
<div id="bookOverlay">
  <div id="bookContainer">
    <div id="book">
      <div class="book-closed" id="bookCover">
        <div class="spine"></div>
        <div class="ornament">✦</div>
        <h2>VOID CHESS</h2>
        <div class="subtitle">RULEBOOK</div>
        <div class="hint">click to open</div>
      </div>
      <div class="book-open" id="bookOpen">
        <button id="bookClose">✕</button>
        <div class="open-spine"></div>
        <div class="page-left" id="pageLeft"><div class="page-content" id="pageLeftContent"></div></div>
        <div class="page-right" id="pageRight"><div class="page-content" id="pageRightContent"></div></div>
        <div class="book-nav">
          <button id="bookPrev">◀ prev</button>
          <span class="page-indicator" id="pageIndicator">1 / 1</span>
          <button id="bookNext">next ▶</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="audio.js?v=2"></script>
<script src="engine.js?v=2"></script>
<script src="ai.js?v=2"></script>
<script src="chess-ui.js?v=8"></script>
</body>
</html>
